[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "news-automation-platform"
version = "0.2.0"
description = "A modular, locally operated news automation platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiosqlite>=0.20,<1",
  "apscheduler>=3.10,<4",
  "feedparser>=6.0,<7",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "lingua-language-detector>=2.0,<3",
  "Pillow>=10.4,<12",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "PyYAML>=6.0,<7",
  "sentence-transformers>=3.0,<6",
  "SQLAlchemy>=2.0,<3",
  "trafilatura>=1.12,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "respx>=0.21,<1",
  "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
